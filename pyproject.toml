[project]
name = "dance-videocut-engine"
version = "0.1.0"
description = "Local video tracking and reframing engine for Dance Videocut"
requires-python = ">=3.9"
dependencies = [
  "imageio-ffmpeg>=0.5.1",
  "numpy>=1.26.0",
  "opencv-python>=4.10.0,<5.0.0"
]

[project.optional-dependencies]
tracking = [
  "ultralytics>=8.3.0"
]

[tool.uv]
package = false
